[package]
name = "pomolog"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Pomodoro timer with kanban, calendar, habits and analytics"

[lib]
name = "pomolog"
path = "src/lib.rs"

[[bin]]
name = "pomolog"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", features = ["canvas", "svg", "tokio", "advanced"] }
tokio = { version = "1", features = ["sync", "rt", "time"] }
rusqlite = { version = "0.43", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["case-insensitive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive"] }
ksni = { version = "0.3", features = ["blocking"] }
notify-rust = "4"
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }
rodio = { version = "0.21", default-features = false, features = ["playback", "wav", "vorbis", "flac", "mp3"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
